/* Layout: app shell — sidebar navigasi di desktop, bilah tab bawah di ponsel; konten berupa panel kerja. */

  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --gold:#f0b55a; --gold-soft:#33270f;

  --fg:#e6edf3; --muted:#9aa9b8;
  --ok:#5cc58f; --ok-soft:#12291d; --warn:#f0b55a; --warn-soft:#33270f; --bad:#f08a80; --bad-soft:#3a1714; --info:#5aa2dc; --info-soft:#132a3f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#5aa2dc; --brand-ink:#08192a; --brand-soft:#132a3f; --brand-deep:#0b3d66;
  --gold:#f0b55a; --gold-soft:#33270f;
  --bg:#0d151d; --surface:#141f2a; --surface-2:#1a2733; --line:#2a3a4a;
  --fg:#e6edf3; --muted:#9aa9b8;
  --ok:#5cc58f; --ok-soft:#12291d; --warn:#f0b55a; --warn-soft:#33270f; --bad:#f08a80; --bad-soft:#3a1714; --info:#5aa2dc; --info-soft:#132a3f;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:1.45rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.05rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.92em}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.num{font-variant-numeric:tabular-nums}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}

/* Demo bar */
.demo{background:var(--gold-soft);border-bottom:1px solid var(--line);padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.8rem}
.demo b{color:var(--warn)}
.demo .roles{display:flex;gap:4px;flex-wrap:wrap}
.demo button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;cursor:pointer}
.demo button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

/* Shell */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:calc(100% - 34px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand img{width:40px;height:40px}
.brand b{display:block;font-size:.95rem;line-height:1.2}
.brand span{font-size:.72rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;background:var(--gold);color:#3a2600;border-radius:999px;font-size:.7rem;padding:0 7px;font-weight:700}
.side .who{margin-top:auto;border-top:1px solid var(--line);padding:12px 6px 0;display:flex;gap:10px;align-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding-block:14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .ta{font-size:.8rem;color:var(--muted)}
.top .spacer{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:34px;min-width:34px;padding:0 8px;display:inline-grid;place-items:center;cursor:pointer;position:relative}
.iconbtn svg{width:18px;height:18px}
.iconbtn .dot{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;border-radius:999px;font-size:.66rem;padding:0 5px;font-weight:700}
.content{padding-block:22px 90px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:1180px;width:100%}
.head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between}
.head p{color:var(--muted);margin-top:4px;max-width:68ch}

/* Components */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel>h2{margin-bottom:12px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--fg)}
.stat .l{color:var(--muted);font-size:.8rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.8rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:.74rem;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-draf{background:var(--surface-2);color:var(--muted)}
.s-diajukan{background:var(--info-soft);color:var(--info)}
.s-revisi{background:var(--warn-soft);color:var(--warn)}
.s-disetujui{background:var(--ok-soft);color:var(--ok)}
.s-ditolak{background:var(--bad-soft);color:var(--bad)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 7px;font-size:.74rem;color:var(--muted);white-space:nowrap}
.tag.t{border-color:var(--brand);color:var(--brand)}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar.gold i{background:var(--gold)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item .body{flex:1;min-width:0}
.item .title{font-weight:700}
.item .meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:4px;font-size:.8rem;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-weight:600;font-size:.82rem}
.field .hint{font-size:.76rem;color:var(--muted)}
input[type=text],input[type=password],input[type=email],input[type=date],input[type=search],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters select,.filters input{width:auto;min-width:150px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.callout{border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface-2);font-size:.84rem}
.callout b{color:var(--brand)}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* ILKPS grid */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tcell{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--surface);cursor:pointer;text-align:left}
.tcell:hover{border-color:var(--brand)}
.tcell .n{font-size:.72rem;font-weight:800;color:var(--brand);letter-spacing:.04em}
.tcell .t{font-size:.8rem;font-weight:600;line-height:1.3}
.tcell .p{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}

/* Drawer / modal */
.overlay{position:fixed;inset:0;background:rgba(8,18,28,.45);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:min(620px,100%);height:100%;overflow:auto;padding:20px;padding-bottom:max(20px,env(safe-area-inset-bottom,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.auto{background:var(--brand-soft);border-radius:8px;padding:8px 12px;font-size:.82rem}
.auto b{color:var(--brand)}
.picker{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:10px}
.classgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.classgrid label{border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:flex;gap:8px;align-items:center;cursor:pointer;font-size:.8rem}
.classgrid label:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:999px;padding:2px 4px 2px 10px;font-size:.78rem}
.pchip button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 4px;font-size:1rem;line-height:1}
.notif{position:absolute;right:0;top:42px;width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.15);padding:8px;z-index:30;text-align:left}

.notif .n.unread{background:var(--brand-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(24px,calc(env(safe-area-inset-bottom,0px) + 80px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:40;max-width:calc(100vw - 32px)}

/* Login */
.login{min-height:calc(100vh - 34px);display:grid;grid-template-columns:1.05fr 1fr}
.login .art{background:var(--brand-deep);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;position:relative;overflow:hidden}

.login .art img{width:84px;height:84px}
.login .art h1{font-size:2.1rem;max-width:16ch;color:#fff}
.login .art p{max-width:46ch;opacity:.85}
.login .art .crit{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.login .art .crit span{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px 10px;font-size:.76rem}
.login .form{padding:48px max(24px,env(safe-area-inset-right,0px)) 48px 48px;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:460px;width:100%}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--brand)}

.tabbar{display:none}

  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}

}
@media (max-width:760px){

  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);overflow-x:auto}
  .tabbar button{flex:1;min-width:68px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;font-size:.68rem;font-weight:600;color:var(--muted);cursor:pointer}
  .tabbar button[aria-current="page"]{color:var(--brand)}
  .tabbar svg{width:20px;height:20px}
  .login{grid-template-columns:1fr}
  .login .art{padding:28px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
  .login .art h1{font-size:1.6rem}
  .login .form{padding:28px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));max-width:none}
  .filters select,.filters input{min-width:0;flex:1 1 140px}
  .brand-m{display:flex!important}
  .top .ta{display:none}
  .brand-m b{white-space:nowrap}
}
.brand-m{display:none;align-items:center;gap:8px}
.brand-m img{width:28px;height:28px}
@media (prefers-reduced-motion:no-preference){.overlay.anim .drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px)}}}
</style>

 const words=q.split(/\s+/).filter(w=>w.length>=3);

}

function gcetSet(){const s=new Set([2,7]);KEG.filter(k=>k.status==="disetujui").forEach(k=>(k.gcet||[]).forEach(g=>s.add(g)));return s}
function scoreOf(m){
 const X=SAMPLE, lv=S.lv[m.n]??m.lv, n=X.ndtps;
 switch(m.f){
  case "ndtps": return [n>=6?4:n>=3?2*n/3:0,"NDTPS = "+n];
  case "pds3": {const p=X.nds3/n;return [p>=.5?4:2+4*p,"PDS3 = "+pct(p)]}
  case "pdsk": {const p=X.nkdtlb/X.ndt;return [p>=.4?4:p>=.2?3:p>=.1?2:p>0?1:0,"PDSK = "+pct(p)]}
  case "pdtpsl": {const p=X.nldtps/n;return [p>=.4?4:p>=.2?3:p>=.1?2:1,"PDTPSL = "+pct(p)]}
  case "sertdos": {const p=X.ndsk/n;return [p>=.5?4:cap(1+6*p),"PDSK = "+pct(p)]}
  case "pgblkl": {const p=X.ngblkl/n;return [p>=.7?4:2+20*p/7,"PGBLKL = "+pct(p)]}
  case "pmki": {const p=prakMK().length/kompMK().length;return [p>=.3?4:cap(2+10*p),"PMKI = "+pct(p)+" ("+prakMK().length+" dari "+kompMK().length+" MK kompetensi diampu praktisi)"]}
  case "pdtt": {const p=X.ndtt/(X.ndt+X.ndtpt);return [p<=.1?4:p<=.4?(14-20*p)/3:0,"PDTT = "+pct(p)]}
  case "pjp": {const p=sumP()/sumSks();return [p>=.2?4:20*p,"PJP = "+pct(p)+" ("+sumP()+" sks praktik / "+sumSks()+" sks, dari Data Prodi › Kurikulum)"]}
  case "rmdtps": {const r=NM()/n;return [r>=15&&r<=25?4:r>25&&r<=35?3:r>35&&r<=45?2:1,"RMDTPS = "+r.toFixed(1)+" ("+NM()+" mahasiswa aktif / "+n+" DTPS)"]}
  case "rdpu": {const r=X.rdpu;return [r<=6?4:r<=10?7-r/2:0,"RDPU = "+r]}
  case "ewmp": {const e=X.ewmp;return [e>=12&&e<=16?4:e>=6&&e<12?(2*e-12)/3:e>16&&e<=18?36-2*e:0,"EWMP = "+e+" sks"]}
  case "pa": {const N=NM(),[i,nn,w]=X.pa;return [riFn(i/N,nn/N,w/N,.001,.01,.02),`Internasional ${i}, nasional ${nn}, lokal ${w} (NM ${N})`]}
  case "pn": {const N=NM(),[i,nn,w]=X.pn;return [riFn(i/N,nn/N,w/N,.002,.02,.04),`Internasional ${i}, nasional ${nn}, lokal ${w} (NM ${N})`]}
  case "ripk": return [X.ripk>=3.25?4:cap((8*X.ripk-6)/5),"RIPK = "+X.ripk];
  case "ms": {const v=X.ms;return [v>3.5&&v<=4.5?4:v>3&&v<=3.5?8*v-24:v>4.5&&v<=7?(56-8*v)/5:0,"MS = "+v+" tahun"]}
  case "ptw": return [X.ptw>=.7?4:1+30*X.ptw/7,"PTW = "+pct(X.ptw)];
  case "pps": return [X.pps>=.85?4:X.pps>=.3?(80*X.pps-24)/11:0,"PPS = "+pct(X.pps)];
  case "wt": return [X.wt<3?4:X.wt<=6?(24-4*X.wt)/3:0,"WT = "+X.wt+" bulan"];
  case "pbs": return [X.pbs>=.6?4:20*X.pbs/3,"PBS = "+pct(X.pbs)];
  case "tk": {const [i,nn,w]=X.tk;return [riFn(i,nn,w,.05,.2,.9),`Internasional ${pct(i)}, nasional ${pct(nn)}, lokal ${pct(w)}`]}
  case "tkp": return [(2*X.tkp+lv)/3,"Skor kepuasan 7 aspek = "+X.tkp+"; analisis tindak lanjut (dinilai GPM) = "+lv];
  case "pen": {const [i,nn,l]=X.pen;return [riFn(i/3/n,nn/3/n,l/3/n,.05,.3,1),`Dana luar negeri ${i}, dalam negeri ${nn}, PT/mandiri ${l} judul (3 tahun)`]}
  case "ppdm": return [X.ppdm>=.25?4:2+8*X.ppdm,"PPDM = "+pct(X.ppdm)];
  case "pub": {const [i,nn,w]=X.pub;return [riFn(i/n,nn/n,w/n,.2,2,4),`Internasional ${i}, nasional ${nn}, lokal ${w}`]}
  case "napj": return [X.napj>=2?4:X.napj===1?3:2,"NAPJ = "+X.napj];
  case "rs": {const r=X.nas/n;return [r>=.5?4:2+4*r,"RS = "+r.toFixed(2)]}
  case "pkm": {const [i,nn,l]=X.pkm;return [riFn(i/3/n,nn/3/n,l/3/n,.07,.5,1.5),`Dana luar negeri ${i}, dalam negeri ${nn}, PT/mandiri ${l} judul (3 tahun)`]}
  case "ppkmdm": return [X.ppkmdm>=.25?4:2+8*X.ppkmdm,"PPkMDM = "+pct(X.ppkmdm)];
  case "pubpkm": {const [i,nn,w]=X.pubpkm;return [riFn(i/n,nn/n,w/n,.01,.1,.5),`Internasional ${i}, nasional ${nn}, lokal ${w}`]}
  case "ks": {const k=X.ks,rk=(3*k.n1+k.n2+2*k.n3)/n,A=Math.min(4,rk),B=riFn(k.ni,k.nn,k.nl,2,6,9);return [(2*A+B)/3,`RK = ${rk.toFixed(1)}; internasional ${k.ni}, nasional ${k.nn}, lokal ${k.nl}`]}
  case "suasana": {const g=X.suasanaGap;return [g<=1?4:g<=3?3:g<=6?2:1,"Jarak terpanjang antar kegiatan = "+g+" bulan"]}
  case "animo": {const a=animo(),C=a>.1?4:a>0?3:a===0?2:1;return [(2*lv+C)/3,"Tren pendaftar "+PMB[0].th+"–"+PMB[PMB.length-1].th+" = "+(a>=0?"+":"")+pct(a)+" (Data Prodi › PMB); kebijakan afirmasi dan akses (GPM) = "+lv]}
  case "dop": return [X.dop>=20?4:X.dop/5,"DOP = Rp"+X.dop+" juta"];
  case "dpd": return [X.dpd>=10?4:2*X.dpd/5,"DPD = Rp"+X.dpd+" juta"];
  case "dpkmd": return [X.dpkmd>=5?4:4*X.dpkmd/5,"DPkMD = Rp"+X.dpkmd+" juta"];
  case "tkm": {const A=X.tkm>=.75?4:X.tkm>=.25?8*X.tkm-2:0;return [(A+2*lv)/3,"TKM = "+pct(X.tkm)+"; analisis tindak lanjut (GPM) = "+lv]}
  case "rrd": {const r=X.nrd/n;return [r>=.5?4:2+4*r,"RRD = "+r.toFixed(2)]}
  case "gcet": {const c=gcetSet().size;return [c>=8?4:c>=5?3:c>=1?2:1,c+" dari 10 pasal sudah diterapkan"]}
  case "sertmhs": {const p=X.sertmhs,B=p>.7?4:p>=.5?3:p>=.25?2:p>0?1:0;return [(lv+B)/2,pct(p)+" mahasiswa semester 7–8 bersertifikat; pelaksanaan uji kompetensi (GPM) = "+lv]}
 }
 if(m.n===8) return [lv,"RPS tersedia di "+pct(mkpPct("rps"))+" MK (Portofolio MK); skor GPM = "+lv];
 if(m.n===22) return [lv,"Metode tercatat di "+pct(mkpPct("metode"))+" MK, integrasi penelitian/PkM di "+pct(mkpPct("integ"))+" MK; skor GPM = "+lv];
 if(m.n===25) return [lv,"Rubrik di "+pct(mkpPct("rubrik"))+" MK, kontrak kuliah di "+pct(mkpPct("kontrak"))+" MK (skor 4 butuh rubrik ≥ 70% MK); skor GPM = "+lv];
 if(DOCS[m.n]){const ds=DOCS[m.n],a=ds.filter((d,i)=>S.docSt[m.n+"-"+i]==="ada").length;return [lv,"Bank dokumen: "+a+" dari "+ds.length+" dokumen tersedia; skor GPM = "+lv]}
 return [lv,"Dinilai GPM dengan rubrik"];
}
function assess(){
 const rows=window.MATRIKS.map(m=>{const [s,info]=scoreOf(m);const sc=Math.round(cap(s)*100)/100;return {...m,s:sc,info,gain:m.w*(4-sc)}});
 const total=rows.reduce((a,r)=>a+r.w*r.s,0);
 const by=Object.keys(window.KRITERIA).map(k=>{const rr=rows.filter(r=>r.k===k);const w=rr.reduce((a,r)=>a+r.w,0);const v=rr.reduce((a,r)=>a+r.w*r.s,0);return {k,l:window.KRITERIA[k],w,v,p:v/(4*w)}});
 return {rows,total,by};
}

let sigDraw=null;
function sigPos(e,c){const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}
document.addEventListener("pointerdown",e=>{if(e.target.id!=="sigpad")return;const c=e.target,x=c.getContext("2d");x.lineCap="round";x.lineJoin="round";x.strokeStyle="#111";x.lineWidth=+(document.getElementById("sigw")?.value||3)*c.width/c.getBoundingClientRect().width;const [px,py]=sigPos(e,c);x.beginPath();x.moveTo(px,py);sigDraw={c,x,n:0};c.setPointerCapture(e.pointerId);c.dataset.dirty="1";e.preventDefault()});
document.addEventListener("pointermove",e=>{if(!sigDraw||e.target!==sigDraw.c)return;const [px,py]=sigPos(e,sigDraw.c);sigDraw.x.lineTo(px,py);sigDraw.x.stroke();sigDraw.n++});
document.addEventListener("pointerup",()=>{sigDraw=null});
// Bersihkan latar putih dan pangkas tepi kosong
function sigClean(img){
 const c=document.createElement("canvas");c.width=img.naturalWidth||img.width;c.height=img.naturalHeight||img.height;const x=c.getContext("2d");x.drawImage(img,0,0);
 const d=x.getImageData(0,0,c.width,c.height),p=d.data;let minX=c.width,minY=c.height,maxX=-1,maxY=-1;
 for(let i=0;i<p.length;i+=4){const v=(p[i]+p[i+1]+p[i+2])/3;if(v>200||p[i+3]<20){p[i+3]=0}else{const k=i/4,X=k%c.width,Y=(k-X)/c.width;if(X<minX)minX=X;if(X>maxX)maxX=X;if(Y<minY)minY=Y;if(Y>maxY)maxY=Y;p[i]=p[i+1]=p[i+2]=Math.min(v,60)}}
 x.putImageData(d,0,0); if(maxX<0) return null;
 const pad=8,w=maxX-minX+1+2*pad,h=maxY-minY+1+2*pad,o=document.createElement("canvas");o.width=w;o.height=h;o.getContext("2d").drawImage(c,minX-pad,minY-pad,w,h,0,0,w,h);return o.toDataURL("image/png");
}

 const id=e.target.id;

 if(S.form){

 }
 if(e.target.classList.contains("pm")&&e.target.tagName==="INPUT"){const k=e.target.dataset.k;S.pm[k]=e.target.value;S.pmLama.delete(k.replace(/_lain$/,""));if(k==="tgllahir"){render();return}const c=pmPct();document.getElementById("pct").textContent=c.n+" dari "+c.all+" · "+c.p+"%";document.getElementById("pctbar").style.width=c.p+"%";return}
