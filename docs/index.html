<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repositori UPW</title>
<meta name="robots" content="noindex">
<style>
:root{color-scheme:light dark;--bg:#f4f6f9;--fg:#14202c;--muted:#5a6878;--brand:#0A5188}
@media (prefers-color-scheme:dark){:root{--bg:#0d151d;--fg:#e6edf3;--muted:#9aa9b8;--brand:#5aa2dc}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
main{max-width:520px;text-align:center}
img{width:96px;height:96px}
h1{font-size:1.4rem;margin:16px 0 8px}
p{color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<main>
<img src="uji/logo.png" alt="Logo Politeknik Pariwisata Bali">
<h1>Repositori Kegiatan Prodi Usaha Perjalanan Wisata</h1>
<p>Politeknik Pariwisata Bali. Aplikasi sedang dalam tahap uji coba dan belum dibuka untuk umum.</p>
</main>
</body>
</html>
